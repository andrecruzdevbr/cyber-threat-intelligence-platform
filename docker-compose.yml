services:
  postgres:
    image: postgres:16
    container_name: cyber-threat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: cyber-threat-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_URL: ${OLLAMA_URL}
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: cyber-threat-dashboard
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8501:8501"
    depends_on:
      - postgres

  kafka:
    image: apache/kafka:3.9.1
    container_name: cyber-threat-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: cyber-threat-kafka-init
    depends_on:
      - kafka
    restart: "no"
    command:
      - bash
      - -lc
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          echo "Aguardando Kafka..."
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic network-traffic --partitions 3 --replication-factor 1

  spark:
    image: apache/spark:3.5.3
    container_name: cyber-threat-spark
    depends_on:
      - kafka
    volumes:
      - ./streaming:/opt/spark/work-dir/streaming
      - ./random_forest_ddos_model.pkl:/opt/spark/work-dir/random_forest_ddos_model.pkl
      - ./model_features.pkl:/opt/spark/work-dir/model_features.pkl
      - ./data_lake:/opt/spark/work-dir/data_lake
    command: ["sleep", "infinity"]

  spark-consumer:
    image: apache/spark:3.5.3
    container_name: cyber-threat-spark-consumer
    depends_on:
      - kafka
      - api
    volumes:
      - ./streaming:/opt/spark/work-dir/streaming
      - ./data_lake:/opt/spark/work-dir/data_lake
    command:
      - bash
      - -lc
      - |
        mkdir -p /tmp/.ivy2
        /opt/spark/bin/spark-submit \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3 \
          --conf spark.jars.ivy=/tmp/.ivy2 \
          /opt/spark/work-dir/streaming/spark_consumer.py

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: cyber-threat-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      DBT_HOST: ${DBT_HOST:-postgres}
      DBT_PORT: ${DBT_PORT:-5432}
      DBT_USER: ${DBT_USER:-cyber_user}
      DBT_PASSWORD: ${DBT_PASSWORD:-change_me}
      DBT_DATABASE: ${DBT_DATABASE:-cyber_threat}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt_cyber:/opt/airflow/dbt_cyber
    depends_on:
      - postgres
    command: standalone

volumes:
  postgres_data: